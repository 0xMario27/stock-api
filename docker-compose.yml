services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-api-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - stock-api-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-api-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - stock-api-net

networks:
  stock-api-net:
    driver: bridge
